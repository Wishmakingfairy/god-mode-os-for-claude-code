name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all bash hooks (fail on errors only)
        run: |
          set -e
          find hooks install.sh uninstall.sh router/setup.sh \
               -type f -name '*.sh' -print0 \
            | xargs -0 -n1 shellcheck -x -S error -e SC1090,SC1091,SC2034,SC2155,SC2086

  json-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validate fixture JSON
        run: |
          set -e
          # Single-document JSON files
          for f in $(find docs/demos/fixtures -maxdepth 1 -name '*.json'); do
            echo "checking $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done
          # JSONL fixtures (one JSON per line)
          for f in $(find docs/demos/fixtures -maxdepth 1 -name '*.jsonl'); do
            echo "checking $f (jsonl)"
            python3 -c "import json,sys; [json.loads(line) for line in open('$f') if line.strip()]"
          done

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      - name: Compile-check router scripts
        run: |
          python3 -m py_compile router/vector/indexer.py
          python3 -m py_compile router/vector/query.py

  install-dryrun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq
      - name: Dry run install (Tier 1)
        env:
          HOME: ${{ runner.temp }}/dryrun-home
        run: |
          set -e
          mkdir -p "$HOME/.claude"
          ./install.sh discipline
          test -L "$HOME/.claude/hooks/stop-validator.sh"
          test -L "$HOME/.claude/hooks/install-guard.sh"
          jq -e '.hooks.PreToolUse | length > 0' "$HOME/.claude/settings.json"
          jq -e '.hooks.Stop | length > 0' "$HOME/.claude/settings.json"
      - name: Dry run uninstall
        env:
          HOME: ${{ runner.temp }}/dryrun-home
        run: |
          set -e
          ./uninstall.sh </dev/null
          test ! -L "$HOME/.claude/hooks/stop-validator.sh"
          # Verify settings.json was actually cleaned (regression guard for the
          # bug where uninstall left dangling hook entries pointing at deleted symlinks)
          test "$(jq '.hooks // {} | length' "$HOME/.claude/settings.json")" = "0"
      - name: Run smoke.sh (verify every README claim against the code)
        env:
          HOME: ${{ runner.temp }}/smoke-home
        run: |
          set -e
          mkdir -p "$HOME"
          bash smoke.sh
